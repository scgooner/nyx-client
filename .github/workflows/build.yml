name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        id: build
        run: gradle build --no-daemon --stacktrace > build.log 2>&1; echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Verify reflected field names
        id: reflect
        run: bash tools/verify-reflection.sh > reflection.log 2>&1; echo "code=$?" >> "$GITHUB_OUTPUT"; cat reflection.log
      - name: Dump 26.3 API
        if: hashFiles('tools/dump-api.sh') != ''
        run: bash tools/dump-api.sh || true
      - name: Publish results to the "out" branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ || true
          cp reflection.log /tmp/out/ 2>/dev/null || true
          cp -r build/api-dump /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null; rm -f /tmp/out/*-sources.jar
          echo "${{ steps.build.outputs.code }}" > /tmp/out/exit-code.txt
          echo "${{ github.sha }}" > /tmp/out/commit.txt
          cd /tmp/out && git init -q -b out && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-client-26.3-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Fail if build failed
        run: test "${{ steps.build.outputs.code }}" = "0" && test "${{ steps.reflect.outputs.code }}" = "0"
