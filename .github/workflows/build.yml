name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Dump 26.3 API
        if: always()
        run: bash tools/dump-api.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-dump
          path: |
            build/api-dump/
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-client-26.3-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
